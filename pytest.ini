[pytest]
testpaths = tests
pythonpath = .
markers =
    ui: DemoBlaze web UI tests
    api: Rahul Shetty Academy e-commerce API tests
addopts =
    --browser chromium
    --reruns 3
    --reruns-delay 1
    --tracing retain-on-failure
    --screenshot only-on-failure
    --output test-results
    --html reports/report.html
    --self-contained-html
    -ra
